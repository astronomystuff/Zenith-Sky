<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zenith Sky</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Zenith Sky</h1>

<!-- Video Stacking Tool -->
<div id="video-tool-root"></div>


<!-- Observation Planner -->
<div class="tool-card" id="planner-root">

  <h2>Observation Planner</h2>

  <button id="toggle-inputs" style="margin-bottom:10px;">Show Inputs</button>

  <div id="input-panel" style="display:none; flex-direction:column; gap:12px; max-width:320px;">

    <label>
      Date:
      <input type="date" id="planner-date">
    </label>

    <label>
      Time:
      <input type="time" id="planner-time">
    </label>

    <label>
      Latitude:
      <input type="number" id="planner-lat" step="0.0001" placeholder="e.g. 37.4">
    </label>

    <label>
      Longitude:
      <input type="number" id="planner-lon" step="0.0001" placeholder="e.g. -118.4">
    </label>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="planner-generate" style="flex:1;">Generate</button>
    </div>

  </div>
</div>

<!-- Planner Modal -->
<div id="planner-modal-overlay" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
">

  <div id="planner-modal" style="
    background:white;
    width:90%;
    height:90%;
    border-radius:12px;
    padding:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  ">

    <div id="planner-pdf-root" style="position:absolute; top:-9999px; left:-9999px;"></div>

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    ">
      <button id="planner-print" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:black;
      ">Download</button>

      <button id="planner-modal-close" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:black;
      ">x</button>
    </div>

    <div id="planner-modal-content" style="
      width:100%;
      height:100%;
      overflow:auto;
    "></div>

  </div>
</div>


<!-- WOIT Tool -->
<div class="tool-card" id="woit-root">
  <h2>What Object Is This?</h2>

  <input type="file" id="woit-input" accept="image/*" hidden>
  <button id="woit-btn">Upload Image</button>

  <div id="woit-preview-container" style="display:none;">
    <img id="woit-preview" style="max-width:300px; margin-top:10px;">
  </div>

  <div id="woit-status"></div>
  <div id="woit-result" style="display:none;"></div>
</div>


<!-- Moon Map Tool -->
<div class="tool-card" id="moonmap-root">
  <h2>Moon Map</h2>
  <button id="moonmap-open">Open Moon Map</button>
</div>


<!-- Moon Map Modal (centered, outside tool-card) -->
<div id="moonmap-modal-overlay" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <div id="moonmap-modal" style="
    background:#808080;
    width:90%;
    height:90%;
    border-radius:12px;
    padding:0;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    color:white;
  ">

    <!-- Header -->
    <div style="
      height:40px;
      padding:8px 12px;
      font-size:14px;
      border-bottom:1px solid #333;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-shrink:0;
      gap:10px;
    ">
      <div>Moon Map</div>

      <button id="moonmap-download-highres" style="
        font-size:13px;
        background:none;
        background:none;
        cursor:pointer;
        color:white;
        display:inline-block;
      ">Download High Resolution Map</button>

      <button id="moonmap-close" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:white;
      ">×</button>
    </div>

    <!-- Canvas Area -->
    <div id="moonmap-canvas-wrapper" style="
      flex:1;
      position:relative;
      overflow:hidden;
    ">
      <canvas id="moonCanvas" style="
        width:100%;
        height:100%;
        display:block;
        cursor:grab;
        background:#808080;
      "></canvas>

      <!-- Controls -->
      <div id="moonmap-controls" style="
        position:absolute;
        right:10px;
        bottom:10px;
        display:flex;
        flex-direction:column;
        gap:6px;
        align-items:flex-end;
      ">

        <input id="moonmap-zoom-slider" type="range"
          min="0.1" max="25" step="0.01" value="1"
          style="width:140px; accent-color:white;">

        <div style="display:flex; gap:6px;">
          <button class="moon-btn" id="moonmap-reset">Reset</button>
          <button class="moon-btn" id="moonmap-flip">Flip N/S</button>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- External scripts -->
<script src="videotool.js"></script>
<script src="planner.js"></script>
<script src="WOIT.js"></script>
<script src="moonmap.js"></script>

</body>
</html>
