<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zenith Sky</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Zenith Sky</h1>

<!-- Video Stacking Tool -->
<div id="video-tool-root"></div>


<!-- Observation Planner -->
<div class="tool-card" id="planner-root">

  <h2>Observation Planner</h2>

  <button id="toggle-inputs" style="margin-bottom:10px;">Show Inputs</button>

  <div id="input-panel" style="display:none; flex-direction:column; gap:12px; max-width:320px;">

    <label>
      Date:
      <input type="date" id="planner-date">
    </label>

    <label>
      Time:
      <input type="time" id="planner-time">
    </label>

    <label>
      Latitude:
      <input type="number" id="planner-lat" step="0.0001" placeholder="e.g. 37.4">
    </label>

    <label>
      Longitude:
      <input type="number" id="planner-lon" step="0.0001" placeholder="e.g. -118.4">
    </label>

    <div style="display:flex; gap:10px; margin-top:10px;">
      <button id="planner-generate" style="flex:1;">Generate</button>
    </div>

  </div>
</div>

<!-- Planner Modal -->
<div id="planner-modal-overlay" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
">

  <div id="planner-modal" style="
    background:white;
    width:90%;
    height:90%;
    border-radius:12px;
    padding:20px;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  ">

    <div id="planner-pdf-root" style="position:absolute; top:-9999px; left:-9999px;"></div>

    <div style="
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:10px;
    ">
      <button id="planner-print" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:black;
      ">Download</button>

      <button id="planner-modal-close" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:black;
      ">x</button>
    </div>

<div id="planner-modal-content" style="
  width:100%;
  height:100%;
  overflow:auto;
">
  <canvas id="planner-map-canvas" style="
    width:100%;
    height:auto;
    display:block;
  "></canvas>
</div>

  </div>
</div>


<!-- WOIT Tool -->
<div class="tool-card" id="woit-root">
  <h2>What Object Is This?</h2>

  <input type="file" id="woit-input" accept="image/*" hidden>
  <button id="woit-btn">Upload Image</button>

  <div id="woit-file-name" style="margin-top:6px; font-size:13px;"></div>
  
  <div id="woit-preview-container" style="display:none;">
    <img id="woit-preview" style="max-width:300px; margin-top:10px;">
  </div>

  <div id="woit-status"></div>
  <div id="woit-result" style="display:none;"></div>
</div>


<!-- Moon Map Tool -->
<div class="tool-card" id="moonmap-root">
  <h2>Moon Map</h2>
  <button id="moonmap-open">Open Moon Map</button>
</div>


<!-- Moon Map Modal -->
<div id="moonmap-modal-overlay" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <div id="moonmap-modal" style="
    background:#808080;
    width:90%;
    height:90%;
    border-radius:12px;
    padding:0;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    color:white;
  ">

    <!-- Header -->
    <div style="
      height:40px;
      padding:8px 12px;
      font-size:14px;
      border-bottom:1px solid #333;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-shrink:0;
      gap:10px;
    ">
      <div>Moon Map</div>

      <button id="moonmap-download-highres" style="
        font-size:13px;
        background:none;
        background:none;
        cursor:pointer;
        color:white;
        display:inline-block;
      ">Download High Resolution Map</button>

      <button id="moonmap-close" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:white;
      ">×</button>
    </div>

    <!-- Canvas Area -->
    <div id="moonmap-canvas-wrapper" style="
      flex:1;
      position:relative;
      overflow:hidden;
    ">
      <canvas id="moonCanvas" style="
        width:100%;
        height:100%;
        display:block;
        cursor:grab;
        background:#808080;
      "></canvas>

      <!-- Controls -->
      <div id="moonmap-controls" style="
        position:absolute;
        right:10px;
        bottom:10px;
        display:flex;
        flex-direction:column;
        gap:6px;
        align-items:flex-end;
      ">

        <input id="moonmap-zoom-slider" type="range"
          min="0.1" max="25" step="0.01" value="1"
          style="width:140px; accent-color:white;">

        <div style="display:flex; gap:6px;">
          <button class="moon-btn" id="moonmap-reset">Reset</button>
          <button class="moon-btn" id="moonmap-flip">Flip N/S</button>
        </div>

      </div>
    </div>

  </div>
</div>

<!-- 3D Sky Engine Tool -->
<div class="tool-card" id="sky3d-root">
  <h2>3D Sky Engine</h2>
  <button id="sky3d-open">Open 3D Sky</button>
</div>

<!-- 3D Sky Modal -->
<div id="sky3d-modal-overlay" style="
  display:none;
  position:fixed;
  top:0; left:0;
  width:100vw; height:100vh;
  background:rgba(0,0,0,0.5);
  justify-content:center;
  align-items:center;
  z-index:9999;
">
  <div id="sky3d-modal" style="
    background:#000;
    width:95%;
    height:95%;
    border-radius:12px;
    padding:0;
    position:relative;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    color:white;
  ">

    <!-- Header -->
    <div style="
      height:40px;
      padding:8px 12px;
      font-size:14px;
      border-bottom:1px solid #333;
      display:flex;
      justify-content:space-between;
      align-items:center;
      flex-shrink:0;
      gap:10px;
      background:#111;
    ">
      <div>3D Sky Engine</div>

  <div id="sky3d-loading" style="
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(12px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:99999;
  color:white;
  font-family:'SF Pro', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size:18px;
  letter-spacing:0.3px;
">
  <div class="spinner" style="
    width:48px;
    height:48px;
    border:4px solid rgba(255,255,255,0.2);
    border-top-color:white;
    border-radius:50%;
    animation:spin 0.9s linear infinite;
  "></div>

  <div id="sky3d-loading-text" style="margin-top:20px; opacity:0.85;">
    Loading sky…
  </div>
</div>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

      <button id="sky3d-close" style="
        font-size:20px;
        background:none;
        border:none;
        cursor:pointer;
        color:white;
      ">×</button>
    </div>

    <!-- Main Layout -->
    <div id="sky3d-layout" style="
      flex:1;
      display:flex;
      overflow:hidden;
      background:#000;
    ">

      <!-- Left Controls -->
      <aside id="sky3d-controls" style="
        width:260px;
        background:#111;
        padding:12px;
        overflow-y:auto;
        border-right:1px solid #333;
      ">

        <h3>Date & Time</h3>
        <label>Year</label>
        <input type="number" id="sky3d-year" value="2025" style="width:100%;">
        <label>Month</label>
        <input type="number" id="sky3d-month" value="1" min="1" max="12" style="width:100%;">
        <label>Day</label>
        <input type="number" id="sky3d-day" value="1" min="1" max="31" style="width:100%;">
        <label>Time (UTC)</label>
        <input type="time" id="sky3d-time" value="00:00" style="width:100%;">
        <label>Era</label>
        <select id="sky3d-era" style="width:100%;">
          <option value="CE" selected>CE</option>
          <option value="BCE">BCE</option>
        </select>
        <button id="sky3d-apply-datetime" style="margin-top:10px; width:100%;">Apply</button>

        <h3 style="margin-top:20px;">Location</h3>
        <label>Latitude</label>
        <input type="number" id="sky3d-lat" step="0.0001" value="0" style="width:100%;">
        <label>Longitude</label>
        <input type="number" id="sky3d-lon" step="0.0001" value="0" style="width:100%;">
        <button id="sky3d-apply-location" style="margin-top:10px; width:100%;">Apply</button>

        <h3 style="margin-top:20px;">Layers</h3>
        <label><input type="checkbox" id="sky3d-planets" checked> Planets</label><br>
        <label><input type="checkbox" id="sky3d-asteroids" checked> Asteroids</label><br>
        <label><input type="checkbox" id="sky3d-constellations" checked> Constellations</label><br>
        <label><input type="checkbox" id="sky3d-dso" checked> Deep Sky Objects</label><br>
        <h3 style="margin-top:20px;">Search</h3>

        <div style="position:relative;">
          <input type="text" id="sky3d-search" placeholder="Search object..." style="width:100%;">
          <div id="sky3d-search-suggestions" class="sky3d-suggestions"></div>
        </div>

        <button id="sky3d-search-btn" style="margin-top:10px; width:100%;">Go</button>
        
      </aside>

      <!-- Canvas Area -->
      <main id="sky3d-canvas-wrapper" style="
        flex:1;
        position:relative;
        background:#000;
      ">
        <canvas id="sky3d-canvas" style="
          width:100%;
          height:100%;
          display:block;
          background:#000;
        "></canvas>
      </main>

      <!-- Right Info Panel -->
      <aside id="sky3d-info" style="
        width:260px;
        background:#111;
        padding:12px;
        overflow-y:auto;
        border-left:1px solid #333;
      ">
        <h3>Selected Object</h3>
        <div id="sky3d-object-name">None</div>
        <div id="sky3d-object-type"></div>
        <div id="sky3d-object-ra-dec"></div>
        <div id="sky3d-object-alt-az"></div>
        <div id="sky3d-object-mag"></div>
        <div id="sky3d-object-distance"></div>

        <h3 style="margin-top:20px;">View</h3>
        <button id="sky3d-lock" disabled style="width:100%; margin-top:10px;">Lock View</button>
      </aside>

    </div>

  </div>
</div>

<div id="sky3d-tooltip" style="
  position: fixed;
  padding: 6px 10px;
  background: rgba(0,0,0,0.85);
  color: white;
  font-size: 12px;
  border-radius: 6px;
  pointer-events: none;
  white-space: nowrap;
  z-index: 999999;
  display: none;
"></div>

<!-- External scripts -->
<script src="videotool.js"></script>
<script src="planner.js"></script>
<script src="WOIT.js"></script>
<script src="moonmap.js"></script>
<script type="module">
  import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
  window.THREE = THREE;
</script>
<script type="module" src="skyengine.js"></script>

</body>
</html>
