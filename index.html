<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Zenith Sky</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Zenith Sky</h1>

<!-- Video Stacking Tool -->
<div id="video-tool-root"></div>

<!-- WOIT Tool -->
<div class="tool-card" id="woit-root">
  <h2>What Object Is This?</h2>

  <input type="file" id="woit-input" accept="image/*" hidden>
  <button id="woit-btn">Upload Image</button>

  <div id="woit-preview-container" style="display:none;">
    <img id="woit-preview" style="max-width:300px; margin-top:10px;">
  </div>

  <div id="woit-status"></div>
  <div id="woit-result" style="display:none;"></div>
</div>

<!-- Observation Planner Tool -->
<div class="tool-card" id="planner-root">

<h2>Observation Planner</h2>

<div style="display:flex; flex-direction:column; gap:12px; max-width:320px;">

  <label>
    Date:
    <input type="date" id="planner-date">
  </label>

  <label>
    Time:
    <input type="time" id="planner-time">
  </label>

  <label>
    Latitude:
    <input type="number" id="planner-lat" step="0.0001" placeholder="e.g. 37.4">
  </label>

  <label>
    Longitude:
    <input type="number" id="planner-lon" step="0.0001" placeholder="e.g. -118.4">
  </label>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <button id="planner-generate" style="flex:1;">Generate</button>
  </div>

</div>
</div>

<!-- ========================= -->
<!-- MODAL OVERLAY + CONTENT   -->
<!-- ========================= -->
<div id="planner-modal-overlay" style="
display:none;
position:fixed;
top:0; left:0;
width:100vw; height:100vh;
background:rgba(0,0,0,0.5);
justify-content:center;
align-items:center;
z-index:9999;
">

<div id="planner-modal" style="
  background:white;
  width:90%;
  height:90%;
  border-radius:12px;
  padding:20px;
  position:relative;
  overflow:hidden;
  display:flex;
  flex-direction:column;
">

<div id="planner-pdf-root" style="position:absolute; top:-9999px; left:-9999px;"></div>
  
  <!-- HEADER WITH DOWNLOAD + CLOSE -->
<div style="
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
">
<button id="planner-print" style="
font-size:20px;
background:none;
border:none;
cursor:pointer;
color:black;
">Download</button>

<button id="planner-modal-close" style="
font-size:20px;
background:none;
border:none;
cursor:pointer;
color:black;
">x</button>
</div>

  <!-- CONTENT -->
  <div id="planner-modal-content" style="
    width:100%;
    height:100%;
    overflow:auto;
  "></div>

</div>
</div>

<!-- External scripts (correct placement) -->
<script src="videotool.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.3/jspdf.umd.min.js"></script>
<script src="planner.js"></script>
<script src="woit.js"></script>

</body>
</html>
